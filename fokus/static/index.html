<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Fokus</title>
<link rel="icon" href="data:,">
<style>
/* ============================================================
   Fokus v2 — интерфейс в стиле Todoist: боковая панель + список.
   AGENTS.md §8. Весь CSS здесь; разметка строится в JS через el().
   ============================================================ */
:root {
  --bg: #1f1f1f; --side: #282828; --card: #2a2a2a; --hover: #333333; --border: #3a3a3a; --border-soft: #313131;
  --text: #f2f2f2; --muted: #a3a3a3; --faint: #6f6f6f; --accent: #e5484d; --accent-text: #fff;
  --ok: #3fb950; --link: #7cb3ff; --shadow: 0 12px 40px rgba(0,0,0,.55);
  --g-now: #e5484d; --g-priority: #f5a623; --g-queue: #3b82f6; --g-delegate: #d4d4d8; --g-someday: #6b6b70; --g-waiting: #8b5cf6; --g-inbox: #a3a3a3;
  --side-w: 262px; --detail-w: 400px; --radius: 10px; --fs: 15px;
}
:root[data-theme="light"] {
  --bg: #ffffff; --side: #fcfaf8; --card: #f6f4f2; --hover: #f1efec; --border: #e5e2de; --border-soft: #eeebe7;
  --text: #202020; --muted: #6b6b6b; --faint: #a0a0a0; --accent: #db4c3f; --ok: #2e9e46; --link: #2563eb; --shadow: 0 12px 40px rgba(0,0,0,.18);
  --g-delegate: #8a8a8f; --g-someday: #9a9a9f; --g-inbox: #8a8a8f;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
body { font: var(--fs)/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
input, select, textarea { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--link); outline-offset: 1px; }
a { color: var(--link); }
h1, h2, h3 { margin: 0; font-weight: 700; }
.muted { color: var(--muted); } .faint { color: var(--faint); } .small { font-size: 13px; }
.row { display: flex; align-items: center; gap: 8px; } .grow { flex: 1 1 auto; min-width: 0; } .wrap { flex-wrap: wrap; }
.hidden { display: none !important; }

/* --- каркас --------------------------------------------------- */
.app { display: grid; grid-template-columns: var(--side-w) 1fr; height: 100%; }
.app.detail-open { grid-template-columns: var(--side-w) 1fr var(--detail-w); }
aside.sidebar { background: var(--side); border-right: 1px solid var(--border-soft); display: flex; flex-direction: column; padding: 14px 10px; overflow-y: auto; }
main { overflow-y: auto; position: relative; }
.main-inner { max-width: 780px; margin: 0 auto; padding: 26px 36px 120px; }
aside.detail { background: var(--side); border-left: 1px solid var(--border-soft); overflow-y: auto; display: none; }
.app.detail-open aside.detail { display: block; }

/* --- боковая панель ------------------------------------------- */
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 10px; }
.brand .logo { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; }
.brand .logo i { width: 12px; height: 12px; border-radius: 50%; border: 3px solid #fff; display: block; }
.brand h1 { font-size: 18px; } .brand .date { font-size: 12px; color: var(--muted); }
.btn-add { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border-radius: 8px; color: var(--accent); font-weight: 600; margin: 4px 0 10px; }
.btn-add:hover { background: var(--hover); }
.btn-add .plus { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 20px; line-height: 1; }
.nav-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border-radius: 7px; color: var(--text); text-align: left; }
.nav-item:hover { background: var(--hover); } .nav-item.active { background: var(--hover); font-weight: 600; }
.nav-item .ic { width: 18px; text-align: center; color: var(--muted); flex: none; }
.nav-item .cnt { margin-left: auto; color: var(--muted); font-size: 12px; }
.nav-item .cnt.alert { color: var(--accent); font-weight: 600; }
.nav-sec { margin-top: 16px; padding: 4px 10px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; display: flex; align-items: center; }
.nav-sec button { margin-left: auto; color: var(--muted); font-size: 18px; line-height: 1; padding: 0 4px; border-radius: 6px; } .nav-sec button:hover { background: var(--hover); color: var(--text); }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.side-foot { margin-top: auto; padding-top: 14px; display: flex; flex-direction: column; gap: 4px; }
.side-foot .kbd { padding: 6px 10px; color: var(--faint); font-size: 12px; }
.lang-toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; margin: 4px 10px; }
.lang-toggle button { padding: 3px 10px; font-size: 13px; color: var(--muted); } .lang-toggle button.on { background: var(--hover); color: var(--text); font-weight: 600; }

/* --- заголовок вида ------------------------------------------- */
.view-head { display: flex; align-items: flex-end; gap: 14px; margin-bottom: 18px; }
.view-head h2 { font-size: 24px; } .view-head .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
.view-head .tools { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.view-head .counter { font-size: 14px; color: var(--muted); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 14px; }
.chip { padding: 4px 11px; border-radius: 999px; border: 1px solid var(--border); font-size: 13px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.chip:hover { background: var(--hover); color: var(--text); } .chip.on { background: var(--hover); color: var(--text); border-color: var(--muted); }
.section { margin: 22px 0 8px; display: flex; align-items: baseline; gap: 10px; }
.section h3 { font-size: 15px; } .section .cnt { color: var(--muted); font-size: 13px; }
.empty { padding: 26px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--border); border-radius: var(--radius); font-size: 14px; }
.empty b { color: var(--text); }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 8px; background: var(--card); border: 1px solid var(--border); font-weight: 600; font-size: 14px; }
.btn:hover { background: var(--hover); } .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); } .btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); } .btn.ghost:hover { background: var(--hover); color: var(--text); }
.btn.small { padding: 4px 10px; font-size: 13px; } .btn.danger { color: #ff8a8e; } .btn:disabled { opacity: .5; cursor: default; }
.link-btn { color: var(--link); font-size: 14px; } .link-btn:hover { text-decoration: underline; }

/* --- строка задачи -------------------------------------------- */
.task { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: start; padding: 9px 8px 9px 4px; border-bottom: 1px solid var(--border-soft); position: relative; border-radius: 6px; }
.task:hover { background: var(--hover); }
.task.selected { background: var(--hover); }
.task .check { width: 22px; height: 22px; margin-top: 2px; border-radius: 50%; border: 2px solid var(--c, var(--muted)); background: color-mix(in srgb, var(--c, var(--muted)) 14%, transparent); display: grid; place-items: center; color: transparent; font-size: 13px; transition: background .15s, color .15s; flex: none; }
.task .check:hover { color: var(--c, var(--muted)); } .task.done .check { background: var(--c, var(--muted)); color: #fff; }
.task .check.checking { background: var(--c); color: #fff; transform: scale(1.1); }
.task .body { min-width: 0; cursor: pointer; }
.task .title { font-size: 15px; line-height: 1.35; word-break: break-word; } .task.done .title { color: var(--muted); text-decoration: line-through; }
.task.big .title { font-size: 17px; font-weight: 600; }
.task .note { color: var(--muted); font-size: 13px; margin-top: 2px; white-space: pre-wrap; word-break: break-word; max-height: 3.9em; overflow: hidden; }
.task .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 3px; font-size: 12px; color: var(--muted); align-items: center; }
.task .meta .due.today, .task .meta .due.overdue { color: var(--accent); font-weight: 600; }
.task .meta .due.tomorrow { color: var(--g-priority); }
.task .meta .proj { display: inline-flex; align-items: center; gap: 5px; }
.task .num { position: absolute; left: -26px; top: 10px; color: var(--faint); font-size: 13px; font-weight: 700; width: 20px; text-align: right; }
.badge { display: inline-flex; align-items: center; padding: 0 7px; border-radius: 999px; font-size: 11px; border: 1px solid var(--border); color: var(--muted); line-height: 18px; }
.badge.warn { color: #ffd38a; border-color: #6b4e14; } .badge.alert { color: #ffb4b6; border-color: #6b2a2d; } .badge.ok { color: #9fe8b4; border-color: #1f5a2f; }
:root[data-theme="light"] .badge.warn { color: #8a5a00; border-color: #f0d49a; } :root[data-theme="light"] .badge.alert { color: #b42318; border-color: #f3b4b0; } :root[data-theme="light"] .badge.ok { color: #1b7a35; border-color: #a8e1b6; }
.task .actions { display: flex; gap: 2px; opacity: 0; transition: opacity .12s; align-self: center; }
.task:hover .actions, .task:focus-within .actions { opacity: 1; }
.ib { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; color: var(--muted); font-size: 15px; } .ib:hover { background: var(--card); color: var(--text); }
.ib.primary { color: var(--link); } .ib.danger:hover { color: #ff8a8e; }
.task .quick { align-self: center; }
.list.numbered { padding-left: 26px; }

/* --- события календаря ----------------------------------------- */
.event { display: grid; grid-template-columns: 110px 1fr; gap: 10px; padding: 7px 8px; border-left: 3px solid var(--link); margin: 4px 0; background: var(--card); border-radius: 6px; font-size: 14px; }
.event .time { color: var(--muted); font-variant-numeric: tabular-nums; } .event .ttl { word-break: break-word; } .event .loc { color: var(--muted); font-size: 12px; }
.day-head { display: flex; align-items: baseline; gap: 10px; margin: 20px 0 6px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
.day-head h3 { font-size: 15px; } .day-head .today { color: var(--accent); font-size: 12px; font-weight: 700; text-transform: uppercase; }

/* --- композер ----------------------------------------------------- */
.composer { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; margin: 0 0 14px; background: var(--card); }
.composer input.ttl { width: 100%; background: transparent; border: 0; padding: 4px 2px; font-size: 16px; font-weight: 600; } .composer input.ttl:focus { outline: none; }
.composer textarea { width: 100%; background: transparent; border: 0; padding: 2px; resize: vertical; min-height: 28px; font-size: 14px; } .composer textarea:focus { outline: none; }
.composer .bar { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border-soft); flex-wrap: wrap; }
.composer .hint { color: var(--faint); font-size: 12px; } .composer select { padding: 4px 8px; font-size: 13px; }
.add-row { display: flex; align-items: center; gap: 10px; padding: 9px 8px; color: var(--muted); border-radius: 6px; width: 100%; text-align: left; }
.add-row:hover { background: var(--hover); color: var(--accent); } .add-row .plus { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; color: var(--accent); }

/* --- модалки, мастер -------------------------------------------- */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: 16px; z-index: 50; }
.modal { background: var(--side); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px; width: min(640px, 100%); max-height: 92vh; overflow: auto; box-shadow: var(--shadow); }
.modal h3 { font-size: 18px; margin-bottom: 12px; }
.modal .bar { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.wizard .q { font-size: 21px; font-weight: 700; margin: 6px 0 14px; line-height: 1.25; }
.wizard .step { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
.wizard .ttl { color: var(--muted); font-size: 14px; margin-bottom: 4px; word-break: break-word; }
.progress { height: 4px; background: var(--card); border-radius: 2px; overflow: hidden; margin: 8px 0 14px; } .progress > div { height: 100%; background: var(--accent); transition: width .2s; }
.opts { display: grid; gap: 6px; }
.opt { display: flex; align-items: center; gap: 12px; text-align: left; font-size: 16px; padding: 11px 14px; border-radius: 10px; background: var(--card); border: 1.5px solid var(--border); }
.opt:hover { border-color: var(--muted); } .opt.sel { border-color: var(--link); background: var(--hover); }
.opt kbd { font: 600 12px/1 ui-monospace, Menlo, monospace; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 3px 6px; min-width: 22px; text-align: center; }
.wizard input.wide { width: 100%; font-size: 16px; margin-top: 6px; }
.summary { text-align: center; padding: 10px 0 0; }
.summary .grp { font-size: 22px; font-weight: 800; display: inline-flex; align-items: center; gap: 8px; }
.summary .sc { font-size: 52px; font-weight: 800; line-height: 1.1; margin: 6px 0; }
.summary .hints { margin: 12px auto 0; max-width: 460px; text-align: left; display: grid; gap: 6px; }
.summary .hints div { background: var(--card); border-radius: 8px; padding: 8px 12px; font-size: 14px; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: #262b36; border: 1px solid var(--border); color: #fff; padding: 10px 14px; border-radius: 10px; font-size: 14px; max-width: min(640px, 92vw); z-index: 60; box-shadow: var(--shadow); display: flex; gap: 14px; align-items: center; }
.toast.err { border-color: var(--accent); } .toast.ok { border-color: var(--ok); } .toast button { color: var(--link); font-weight: 600; }
.skeleton { height: 42px; border-radius: 6px; background: linear-gradient(90deg, var(--card), var(--hover), var(--card)); background-size: 200% 100%; animation: sk 1.2s infinite; margin-bottom: 6px; }
@keyframes sk { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* --- панель задачи ------------------------------------------------ */
.detail-inner { padding: 18px 18px 60px; }
.detail .top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.detail input.ttl { width: 100%; font-size: 18px; font-weight: 700; background: transparent; border: 1px solid transparent; padding: 6px 8px; border-radius: 8px; }
.detail input.ttl:hover, .detail textarea.note:hover { border-color: var(--border); }
.detail textarea.note { width: 100%; background: transparent; border: 1px solid transparent; min-height: 60px; resize: vertical; padding: 6px 8px; border-radius: 8px; font-size: 14px; }
.kv { display: grid; grid-template-columns: 120px 1fr; gap: 6px 10px; font-size: 14px; margin: 12px 0; }
.kv .k { color: var(--muted); }
.detail .block { border-top: 1px solid var(--border-soft); padding-top: 12px; margin-top: 12px; }
.detail .block h4 { margin: 0 0 8px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.jrow { font-size: 13px; color: var(--muted); padding: 3px 0; display: grid; grid-template-columns: 96px 1fr; gap: 8px; }
.jrow b { color: var(--text); font-weight: 600; }

/* --- настройки ---------------------------------------------------- */
.card { background: var(--card); border: 1px solid var(--border-soft); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px; }
.card h3 { font-size: 16px; margin-bottom: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.field label { display: block; color: var(--muted); font-size: 13px; margin-bottom: 4px; } .field input, .field select, .field textarea { width: 100%; }
details summary { cursor: pointer; color: var(--muted); font-weight: 600; margin-bottom: 10px; }
table.journal { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
table.journal th, table.journal td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--border-soft); vertical-align: top; word-break: break-word; }
table.journal th { color: var(--muted); font-weight: 600; } table.journal th:first-child, table.journal td:first-child { width: 20%; }
.proj-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--border-soft); }
.proj-row input[type=text] { flex: 1; } .proj-row input[type=color] { width: 36px; height: 30px; padding: 2px; }
.proj-row.archived { opacity: .6; }
.color-swatches { display: flex; gap: 6px; flex-wrap: wrap; } .swatch { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; } .swatch.on { border-color: var(--text); }

/* --- узкие экраны --------------------------------------------------- */
.menu-btn { display: none; position: fixed; top: 10px; left: 10px; z-index: 40; width: 38px; height: 38px; border-radius: 9px; background: var(--side); border: 1px solid var(--border); font-size: 18px; }
.nav-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 44; }  /* вне сетки: иначе занимает ячейку grid */
@media (max-width: 960px) {
  .app, .app.detail-open { grid-template-columns: 1fr; }
  aside.sidebar { position: fixed; inset: 0 auto 0 0; width: var(--side-w); z-index: 45; transform: translateX(-100%); transition: transform .18s; box-shadow: var(--shadow); }
  .app.nav-open aside.sidebar { transform: none; }
  .app.nav-open .nav-overlay { display: block; }
  .menu-btn { display: grid; place-items: center; }
  .main-inner { padding: 60px 16px 120px; }
  aside.detail { position: fixed; inset: 0; width: 100%; z-index: 46; }
  .task .actions { opacity: 1; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <button class="menu-btn" id="menu-btn" title="Меню">☰</button>
  <div class="nav-overlay" id="nav-overlay"></div>
  <aside class="sidebar" id="sidebar"></aside>
  <main><div class="main-inner" id="main"></div></main>
  <aside class="detail" id="detail"></aside>
</div>
<script>
(function () {
  'use strict';
  // ------------------------------------------------------------ константы и состояние
  const GROUPS = ['now', 'priority', 'queue', 'delegate', 'someday', 'waiting'];
  const GROUP_ICON = { now: '🔴', priority: '🟠', queue: '🔵', delegate: '⚪', someday: '⚫', waiting: '⏸', inbox: '📥' };
  const GROUP_COLOR = { now: 'var(--g-now)', priority: 'var(--g-priority)', queue: 'var(--g-queue)', delegate: 'var(--g-delegate)', someday: 'var(--g-someday)', waiting: 'var(--g-waiting)', inbox: 'var(--g-inbox)' };
  const SWATCHES = ['#14b8a6', '#22c55e', '#a855f7', '#3b82f6', '#f5a623', '#e5484d', '#ec4899', '#8b8b8b'];
  const state = {
    lang: 'ru', L: {}, settings: null, projects: [], counts: {}, review: 0, today: { n: 0, limit: 3 }, serverToday: '',
    route: { view: 'today', arg: null }, sort: 'score', chip: '', composer: null, detailId: null, wiz: null, showDone: false
  };
  let busy = false;

  // ------------------------------------------------------------ утилиты
  const $ = (s) => document.querySelector(s);
  function t(key, vars) {
    let s = state.L[key]; if (s === undefined) s = key;
    if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? String(vars[k]) : m));
    return s;
  }
  function el(tag, attrs) {
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k]; if (v === null || v === undefined || v === false) continue;
      if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v; else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v);
    }
    for (let i = 2; i < arguments.length; i++) append(e, arguments[i]);
    return e;
  }
  function append(p, c) {
    if (c === null || c === undefined || c === false) return;
    if (Array.isArray(c)) { c.forEach((x) => append(p, x)); return; }
    p.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)));
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); return n; }
  function dot(color) { return el('span', { class: 'dot', style: { background: color } }); }
  function gdot(g) { return dot(GROUP_COLOR[g] || 'var(--muted)'); }
  const locale = () => (state.lang === 'de' ? 'de-DE' : 'ru-RU');
  function fmtDay(iso, opts) { try { return new Intl.DateTimeFormat(locale(), opts || { weekday: 'short', day: 'numeric', month: 'short' }).format(new Date(iso + 'T00:00:00')); } catch (e) { return iso; } }
  function fmtTime(iso) { return iso && iso.length >= 16 ? iso.slice(11, 16) : ''; }
  function fmtTs(ts) { return String(ts || '').replace('T', ' ').slice(0, 16); }
  function fmtScore(s) { return Number(s || 0).toFixed(1); }
  function projectOf(id) { return state.projects.find((p) => p.id === id) || { id: id, name: id, color: 'var(--muted)' }; }
  function isTodayNow(task) { return !!task.is_today && task.today_date === state.serverToday; }
  function dueLabel(task) {
    if (task.days_left === null || task.days_left === undefined) return t('no_deadline');
    const n = task.days_left;
    if (n < 0) return t('due_overdue', { n: -n }); if (n === 0) return t('due_today'); if (n === 1) return t('due_tomorrow');

    status.textContent = (s.calendar_urls || []).length ? (cache && cache.fetched_at ? t('settings_calendar_status', { n: cache.events_count !== undefined ? cache.events_count : (cache.events || []).length, time: fmtTs(cache.fetched_at) }) + ((cache.errors || []).length ? ' · ' + t('calendar_error') : '') : t('settings_calendar_none')) : t('settings_calendar_none');
    const refreshBtn = el('button', { class: 'btn small', text: t('settings_calendar_check'), onclick: () => guarded(async () => {
      try { await saveSettings(); const r = await api('POST', '/api/calendar/refresh'); status.textContent = t('settings_calendar_status', { n: r.events_count, time: fmtTs(r.fetched_at) }) + ((r.errors || []).length ? ' · ' + t('calendar_error') : ''); toast(t('saved'), 'ok'); }
      catch (e) { showError(e); }
    }) });
    main.appendChild(el('div', { class: 'card' }, el('h3', { text: t('settings_calendar') }),
      el('div', { class: 'field' }, el('label', { text: t('settings_calendar_urls') }), urls),
      el('p', { class: 'muted small', text: t('settings_calendar_help', { min: s.calendar_refresh_min || 15 }) }),
      el('p', { class: 'small', style: { color: '#ffd38a' }, text: t('settings_calendar_warn') }),
      el('div', { class: 'grid2' }, el('div', { class: 'field' }, el('label', { text: t('settings_timezone') }), tz), num('calendar_refresh_min', 'settings_refresh_min', '1', '5', '1440')),

      el('div', { class: 'grid2' }, num('weights.importance', 'w_importance', '0.05', '0', '1000'), num('weights.urgency', 'w_urgency', '0.05', '0', '1000'), num('weights.consequence', 'w_consequence', '0.05', '0', '1000'), num('weights.duration', 'w_duration', '0.05', '0', '1000')),
      el('div', { class: 'grid2', style: { marginTop: '10px' } }, num('thresholds.now', 'th_now', '1', '1', '100'), num('thresholds.priority', 'th_priority', '1', '1', '100'), num('thresholds.queue', 'th_queue', '1', '1', '100')));

    async function saveSettings() {
      const patch = { weights: {}, thresholds: {} };
      for (const path in inputs) {

      el('button', { class: 'btn danger', text: t('btn_shutdown'), onclick: () => { if (!window.confirm(t('shutdown_confirm'))) return; guarded(async () => { try { await api('POST', '/api/shutdown'); } catch (e) {} clear(main); main.appendChild(el('div', { class: 'empty' }, el('b', { text: t('shutdown_done') }))); }); } })));
  }

  // ------------------------------------------------------------ клавиатура, новый день, запуск
  document.addEventListener('keydown', (ev) => {
    const tag = ev.target && ev.target.tagName;
    if (ev.key === 'Escape') { if (state.composer) { closeComposer(); return; } if (state.detailId && !document.querySelector('.overlay')) { closeDetail(); return; } }
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (ev.key === 'q' || ev.key === 'й') { ev.preventDefault(); if (!document.querySelector('.overlay')) openComposer(); }
  });
  async function checkNewDay() {
    let h; try { h = await api('GET', '/api/health'); } catch (e) { return; }
    if (!h || !h.today) return;
    const changed = state.serverToday && h.today !== state.serverToday; state.serverToday = h.today;
    if (changed) { toast(t('new_day'), 'ok'); await refreshSidebar(); await render(); }
  }
  async function init() {
    try { state.settings = await api('GET', '/api/settings'); applyTheme(); await loadLang(state.settings.language || 'ru'); } catch (e) { showError(e); }

  }

})();
